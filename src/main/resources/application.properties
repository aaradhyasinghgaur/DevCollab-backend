spring.application.name=backend

# Server port binding (dynamically assigned by Render/Railway/CloudRun via PORT, default 8080)
server.port=${PORT:8080}
# Trust reverse proxy headers (X-Forwarded-Proto, X-Forwarded-Host) so OAuth2 generates https:// redirect URIs
server.forward-headers-strategy=framework

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# PostgreSQL Datasource configuration (supports DATABASE_URL, SPRING_DATASOURCE_URL, Railway PG* variables, or local fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:devcollab}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:1234}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=INFO
logging.level.org.springframework.web=INFO

# OAuth2 Provider Credentials (override in production via environment variables or local .env)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}

spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:your-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:your-github-client-secret}

# Optional Redis configuration (host/port/password or handled via RedisConfig)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Decoupled Deployment: Frontend URL and CORS allowed origins
# Set APP_FRONTEND_URL to your deployed frontend (e.g. https://your-project.vercel.app)
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
# Comma-separated allowed origin patterns for CORS (supports wildcards like https://*.vercel.app)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://*.vercel.app,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

